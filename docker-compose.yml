name: lilt-music-library

x-engine: &engine
  build:
    context: .
    dockerfile: docker/engine.Dockerfile
    args:
      DENO_VERSION: "2.6.3"
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATA_DIR: /app/data
    DOWNLOADS_DIR: /downloads
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - ./data:/app/data
    - ./downloads:/downloads

services:
  api:
    <<: *engine
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *engine
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.db import connect; from datetime import datetime,UTC; c=connect(); r=c.execute('SELECT updated_at FROM worker_heartbeat ORDER BY updated_at DESC LIMIT 1').fetchone(); c.close(); raise SystemExit(0 if r and (datetime.now(UTC)-datetime.fromisoformat(r[0])).total_seconds()<15 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
